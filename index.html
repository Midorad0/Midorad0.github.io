<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GeoGebra Rechner Suite</title>
    
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #fff; }
        #ggb-element { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="ggb-element"></div>

    <script>
        var params = {
            "appName": "suite", // Lädt die offizielle iPad "Rechner Suite"
            "width": window.innerWidth,
            "height": window.innerHeight,
            "showToolBar": true,
            "showAlgebraInput": true,
            "showMenuBar": true,
        };
        
        var applet = new GGBApplet(params, true);
        window.addEventListener("load", function() {
            applet.inject('ggb-element');
        });

        window.addEventListener("resize", function() {
            if(window.ggbApplet) {
                window.ggbApplet.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
